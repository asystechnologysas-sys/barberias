services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asys
      POSTGRES_PASSWORD: asys
      POSTGRES_DB: asys_barber
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asys -d asys_barber"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["3000:3000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  postgres_data:
