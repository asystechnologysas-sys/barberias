<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ASYS Barber - Software de Gestión</title>

    <!-- FAVICON INICIAL -->
    <link id="dynamic-favicon" rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- SCRIPT AUTOMÁTICO: RECORTA EL ICONO EN CÍRCULO PERFECTO (RADIO 50%) -->
    <script>
      (function() {
        const img = new Image();
        img.src = '/icon.png';
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = 128;
          canvas.height = 128;
          const ctx = canvas.getContext('2d');
          
          // Recorte circular radio 50%
          ctx.beginPath();
          ctx.arc(64, 64, 64, 0, Math.PI * 2, true);
          ctx.closePath();
          ctx.clip();
          
          // Dibujar la imagen recortada
          ctx.drawImage(img, 0, 0, 128, 128);
          
          // Asignar el icono circular resultante a la pestaña
          const favicon = document.getElementById('dynamic-favicon');
          if (favicon) {
            favicon.href = canvas.toDataURL('image/png');
          }
        };
      })();
    </script>

    <!-- MANIFIESTO PWA PARA INSTALAR EN CELULARES -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1554ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- TIPOGRAFÍAS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
