<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Máscara que recorta cualquier contenido en un círculo perfecto -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="256" />
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <image href="/logoAsys.png" width="512" height="512" preserveAspectRatio="xMidYMid slice" />
  </g>
</svg>